name: Weekly review refresh

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC

permissions:
  contents: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh pipeline (ingest -> embed -> analysis)
        env:
          EMBEDDING_BACKEND: local
        run: |
          set -e
          echo "Running incremental refresh with analysis pipeline stage..."
          python -m src.ops.run refresh --incremental --simulated-analysis

      - name: Smoke test
        continue-on-error: true
        env:
          EMBEDDING_BACKEND: local
          RAG_USE_GROQ: "false"  # validate retrieval without spending chat tokens
        run: python scripts/smoke_test.py

      - name: Verify search index matches corpus
        env:
          EMBEDDING_BACKEND: local
        run: python scripts/verify_index.py

      - name: Commit refreshed artifacts if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/*.json vector_store/
          if git diff --staged --quiet; then
            echo "No artifact changes to commit."
          else
            git commit -m "chore: weekly review refresh (ingest + embed + search index)"
            git pull --rebase origin main
            git push
          fi
